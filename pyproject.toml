[project]
name = "toprodimo"
version = "0.1.0"
description = "Interface to interpolate and convert 2D (r, theta) datasets from simulation outputs to ProDiMo"
readme = "README.md"
authors = [
    { name = "gwf" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "deep-chainmap>=0.1.3",
    "inifix>=6.1.1",
    "matplotlib>=3.10.8",
    "nonos>=0.19.1",
    "numpy>=2.3.5",
    "prodimopy>=2.5.2",
    "tomli>=2.4.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
toprodimo = "toprodimo.main:main"

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
